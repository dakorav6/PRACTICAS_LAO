<mat-toolbar color="primary">
  
  <button mat-button routerLink="/home" class="app-name">
    {{ appName }}
  </button>

  <span class="spacer"></span>

  <nav class="desktop-nav">
    @for (item of navItems; track item.path) {
      <button mat-button 
              [routerLink]="item.path" 
              routerLinkActive="active-link"
              [color]="item.isSpecial ? 'accent' : ''"
              [class.mat-raised-button]="item.isSpecial">
        {{ item.label }}
      </button>
    }
  </nav>

  <!--  Menú para dispositivos móviles -->

  <button mat-icon-button [matMenuTriggerFor]="mobileMenu" class="mobile-menu-btn">
    <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #mobileMenu="matMenu">
    @for (item of navItems; track item.path) {
      <button mat-menu-item [routerLink]="item.path">
        {{ item.label }}
      </button>
    }
  </mat-menu>

</mat-toolbar>
