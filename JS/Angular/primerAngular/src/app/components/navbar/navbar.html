<mat-toolbar color="primary">
  
  <button mat-button routerLink="/home" class="app-name">
    {{ appName }}
  </button>

  <span class="spacer"></span>

  <nav class="desktop-nav">
    <button mat-button routerLink="/home" routerLinkActive="active-link">Inicio</button>
    <button mat-button routerLink="/about" routerLinkActive="active-link">Acerca de</button>
    <button mat-button routerLink="/contact" routerLinkActive="active-link">Contacto</button>
    <button (click)="loginModal()" mat-button  routerL color="accent" class="mat-raised-button">Login</button>
  </nav>

  <!--  Menú para dispositivos móviles -->

  <button mat-icon-button [matMenuTriggerFor]="mobileMenu" class="mobile-menu-btn">
    <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #mobileMenu="matMenu">
    <button mat-menu-item routerLink="/home">Inicio</button>
    <button mat-menu-item routerLink="/about">Acerca de</button>
    <button mat-menu-item routerLink="/contact">Contacto</button>
    <button mat-menu-item routerLink="/login">Login</button>
  </mat-menu>

</mat-toolbar>
