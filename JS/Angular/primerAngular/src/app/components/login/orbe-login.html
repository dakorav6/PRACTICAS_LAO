<div class="login-container">
  <mat-card>
    <mat-card-header><mat-card-title>Acceso</mat-card-title></mat-card-header>
    <mat-card-content>
      <mat-form-field appearance="outline">
        <mat-label>Usuario</mat-label>
        <input matInput [(ngModel)]="credenciales.usuario">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Clave</mat-label>
        <input matInput type="password" [(ngModel)]="credenciales.clave">
      </mat-form-field>
      <p [ngStyle]="{'color': esCorrecto ? 'green' : 'red'}">{{ mensaje }}</p>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="validar()">ENTRAR</button>
    </mat-card-actions>
  </mat-card>
</div>
