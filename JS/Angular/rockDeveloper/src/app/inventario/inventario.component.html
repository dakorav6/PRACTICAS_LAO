<h3 style="text-align: center;padding-top: 1%;">Inventario - RockDevelopers</h3>
<div style="padding-top: 1%; margin: 0 auto; width: 50%;">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table table table-hover">
        <!-- Position Column -->
        <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef style="color: aliceblue;">No.</th>
            <td mat-cell *matCellDef="let element">{{element.position}}</td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef style="color: aliceblue;">Artículo</th>
            <td mat-cell *matCellDef="let element">{{element.name}}</td>
        </ng-container>

        <!-- Weight Column -->
        <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef style="color: aliceblue;">Precio</th>
            <td mat-cell *matCellDef="let element">{{element.price}}</td>
        </ng-container>

        <!-- Symbol Column -->
        <ng-container matColumnDef="proveed">
            <th mat-header-cell *matHeaderCellDef style="color: aliceblue;">Proveedor</th>
            <td mat-cell *matCellDef="let element">{{element.proveed}}</td>
        </ng-container>

        <!-- Action Column -->
        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef style="color: aliceblue;">Acciones</th>
            <td mat-cell *matCellDef="let element">
                <button class="btn btn-primary btn-sm m-1">Editar</button>
                <button class="btn btn-warning btn-sm m-1" (click)="mostrarProducto(element)">Consultar</button>
                <button class="btn btn-danger btn-sm m-1" (click)="eliminarProducto(element)">Eliminar</button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns;"
        ></tr>
    </table>
</div>
